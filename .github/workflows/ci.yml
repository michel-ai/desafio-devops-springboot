
name: CI - Spring Boot DevOps

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Testes Maven e Build Docker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: desafio
          POSTGRES_USER: desafio
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desafio -d desafio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/desafio
      DB_USERNAME: desafio
      DB_PASSWORD: ci_test_password

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Permissao do Maven Wrapper
        run: chmod +x ./mvnw

      - name: Executar testes e gerar JAR
        run: ./mvnw --batch-mode clean verify

      - name: Construir imagem Docker
        run: docker build --tag desafio-app:ci .

      - name: Validar imagem criada
        run: docker image inspect desafio-app:ci

      - name: Resumo
        run: |
          echo "### CI concluida" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java 21" >> "$GITHUB_STEP_SUMMARY"
          echo "- Maven: clean verify" >> "$GITHUB_STEP_SUMMARY"
          echo "- PostgreSQL 17" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker: desafio-app:ci" >> "$GITHUB_STEP_SUMMARY"
