
apiVersion: apps/v1
kind: Deployment
metadata:
  name: desafio-app
  labels:
    app: desafio-app

spec:
  replicas: 1
  revisionHistoryLimit: 3

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: desafio-app

  template:
    metadata:
      labels:
        app: desafio-app

    spec:
      automountServiceAccountToken: false

      # Seguranca no nivel do Pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: desafio-app
          image: desafio-app:local
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Configuracoes externas
          envFrom:
            - configMapRef:
                name: desafio-config

          # Credenciais armazenadas em Secret
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: desafio-db-secret
                  key: DB_PASSWORD

          # Seguranca no nivel do container
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # Verifica se a aplicacao iniciou
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          # Verifica se pode receber requisicoes
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Verifica se o processo continua saudavel
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
              scheme: HTTP
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # Recursos reservados e limites
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi

          terminationMessagePolicy: File
