
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: desafio
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafio -d desafio"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - desafio-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: desafio-app:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/desafio
      DB_USERNAME: desafio
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - desafio-network

volumes:
  postgres_data:

networks:
  desafio-network:
    driver: bridge
